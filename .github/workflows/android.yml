name: Build ARTandPX APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ARTandPX v2
        run: |
          ZIP_FILE="ARTandPX-v2.3-Combined-Source.zip"
          test -f "$ZIP_FILE" || {
            echo "ARTandPX v2 ZIP not found!"
            exit 1
          }

          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          SETTINGS_FILE=$(find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          test -n "$SETTINGS_FILE" || {
            echo "Gradle settings file not found!"
            exit 1
          }

          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"

          echo "Building project from: $ROOT_DIR"
          ls -la "$ROOT_DIR"

      - name: Build ARTandPX v2 APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload ARTandPX v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTandPX-v2.3(continue)-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
